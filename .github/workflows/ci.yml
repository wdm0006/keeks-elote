name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Create virtual environment
        run: uv venv --python ${{ matrix.python-version }}

      # Mirrors `make install`
      - name: Install dependencies
        run: uv pip install -e '.[dev]'

      # Mirrors `make test`
      - name: Run tests
        run: uv run pytest --cov=keeks_elote tests/

      # Mirrors `make lint`
      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

  floor:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Create virtual environment
        run: uv venv --python 3.10

      # Runtime deps only: the dev extra carries placeholder floors
      # (ruff>=0.0.1) that resolve to unusable pins under lowest-direct.
      - name: Install runtime dependencies at their declared floors
        run: uv pip install --resolution lowest-direct -e .

      - name: Install test tooling at current versions
        run: uv pip install pytest pytest-mock pytest-cov

      - name: Import the package
        run: uv run python -c "import keeks_elote"

      - name: Run tests
        run: uv run pytest tests/
