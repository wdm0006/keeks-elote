[project]
name = "keeks-elote"
version = "0.1.1"
description = "A project integrating elote and keeks for rating systems and bankroll management."
authors = [
    { name = "Will McGinnis" },
]
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
keywords = ["rating-systems", "elo", "kelly-criterion", "bankroll", "backtesting", "sports"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "keeks>=0.3.0",
    "elote>=1.2.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.0",
    "pytest>=6.2",
    "pytest-cov",
    "pytest-mock",
    "ruff>=0.0.1",
    # Add other dev dependencies here
]

[project.urls]
Homepage = "https://github.com/wdm0006/keeks-elote"
Repository = "https://github.com/wdm0006/keeks-elote"
Issues = "https://github.com/wdm0006/keeks-elote/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "C", "I"]
ignore = ["E501"]

[tool.ruff.format]
# Using default ruff formatter settings

[[tool.mypy.overrides]]
module = "keeks.*"
ignore_missing_imports = true
