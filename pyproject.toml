[project]
name = "keeks-elote"
version = "0.4.0"
description = "A project integrating elote and keeks for rating systems and bankroll management."
authors = [
    { name = "Will McGinnis" },
]
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
keywords = ["rating-systems", "elo", "kelly-criterion", "bankroll", "backtesting", "sports"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    # keeks 0.9.0 is the allocation-layer floor: the weekly-portfolio backtest
    # (keeks_elote.portfolio_backtest) consumes keeks.allocation's joint-return
    # models and simulator, and the [allocation] extra transitively provides the
    # scipy the scenario-based MeanCVaR allocator optimizes with.
    "keeks[allocation]>=0.9.0,<0.10",
    # elote's matchup() gained its outcome/scores parameters in 1.3.0; on 1.2.x the
    # arena cannot receive a recorded result, so backtests would silently re-decide
    # every settled game through the user's comparison function. 1.5.x adds
    # competitor variants without touching the matchup() contract keeks-elote
    # relies on.
    "elote>=1.3.0,<2",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.0",
    "pytest>=6.2",
    "pytest-cov",
    "pytest-mock",
    "ruff>=0.0.1",
    # Add other dev dependencies here
]

[tool.uv.sources]
# keeks 0.9.0 ships its allocation layer on GitHub master (version.py says 0.9.0)
# but has not been published to PyPI yet, so the lock resolves the declared
# >=0.9.0,<0.10 floor from the exact master commit instead of the registry.
# Once keeks 0.9.0 reaches PyPI, delete this entry and re-lock — the published
# metadata never carries tool.uv.sources, so downstream users are unaffected.
keeks = { git = "https://github.com/wdm0006/keeks", rev = "091aad9ede9da4ce33add7ac78ee447a346a015f" }

[project.urls]
Homepage = "https://github.com/wdm0006/keeks-elote"
Repository = "https://github.com/wdm0006/keeks-elote"
Issues = "https://github.com/wdm0006/keeks-elote/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120
# Markdown stays out of the formatter: ruff 0.16 formats embedded code blocks in
# .md files and its patcher has corrupted surrounding prose (word transpositions,
# duplicated lines) on this repo's README. Docs are prose, not formatted source.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "C", "I"]
ignore = ["E501"]

[tool.ruff.format]
# Using default ruff formatter settings

[[tool.mypy.overrides]]
module = "keeks.*"
ignore_missing_imports = true
